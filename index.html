<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Vaibhav Mahapatra — Robotics Perception</title>
    <meta
      name="description"
      content="Robotics perception R&D — 6D pose estimation, learned control, and the gap between a good benchmark and a working robot."
    />
    <link rel="canonical" href="https://vai-bhav-m.github.io/" />

    <!--
      Link preview card for Slack, LinkedIn, iMessage, X.

      og:image MUST be an absolute URL — crawlers fetch it without page context,
      so a relative path silently yields no preview at all. Same for og:url.

      The image itself is generated by ml/build_og_image.py from about.md, so it
      cannot drift out of sync with the page.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vai-bhav-m.github.io/" />
    <meta property="og:title" content="Vaibhav Mahapatra — Robotics Perception" />
    <meta
      property="og:description"
      content="6D pose estimation, learned control, and the gap between a good benchmark and a working robot."
    />
    <meta property="og:image" content="https://vai-bhav-m.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vaibhav Mahapatra — robotics perception portfolio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vaibhav Mahapatra — Robotics Perception" />
    <meta
      name="twitter:description"
      content="6D pose estimation, learned control, and the gap between a good benchmark and a working robot."
    />
    <meta name="twitter:image" content="https://vai-bhav-m.github.io/og.png" />

    <!--
      Theme, decided before the first paint.

      This must stay INLINE and SYNCHRONOUS here in <head>. The browser stops and
      runs it before painting anything, so the correct theme is on <html> from the
      very first frame. Move this into React (or into a module script) and visitors
      on dark mode get a white flash while the bundle loads.

      See docs/03-features-and-ui.md#the-flash-you-must-prevent
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage throws in some privacy modes; light is a fine fallback */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run manually from the Actions tab

# Required. Without pages:write and id-token:write the deploy step fails with an
# opaque authentication error.
permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes in quick succession would otherwise race, and the older one can win.
# cancel-in-progress: false lets the first finish rather than leaving a half-
# published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci (not install) builds exactly what package-lock.json pins, so CI
      # builds what you tested locally.
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
